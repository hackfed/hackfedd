[general]
; IPv6 addresses containing a port use brackets in Asterisk configuration.
; Restrict this with your firewall to the Hackfed WireGuard interface;
; directory peers do not currently authenticate.
bindport = 4569
bindaddr = [::]:4569

disallow = all
allow = opus,g722,ulaw

