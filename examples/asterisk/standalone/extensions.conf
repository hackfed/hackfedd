[general]
static = yes
writeprotect = yes
autofallthrough = yes
clearglobalvars = yes

; Generated peer contexts and the generated [hackfed-outbound] context.
#tryinclude hackfed/extensions-inbound.conf
#tryinclude hackfed/extensions-outbound.conf

[internal]
; Make Hackfed routes available to your internal callers.
include => hackfed-outbound

; Example internal phones.
exten => _1XX,1,Dial(PJSIP/${EXTEN},30,rT)
 same => n,Hangup()

; Operator-owned inbound contract. ARG1 is already the local subscriber suffix;
; it is empty when the exact organization prefix was called.
[HackfedIncomingRouter]
exten => s,1,GotoIf($["${ARG1}" = ""]?main:direct)
 same => n(main),Dial(PJSIP/100&PJSIP/101,30,rT)
 same => n,Return()
 same => n(direct),Dial(PJSIP/${ARG1},30,rT)
 same => n,Return()
