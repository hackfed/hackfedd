; FreePBX loads extensions_custom.conf from its generated dialplan.
#tryinclude hackfed/extensions-inbound.conf
#tryinclude hackfed/extensions-outbound.conf

[from-internal-custom]
include => hackfed-outbound

; Operator-owned inbound contract. Customize these destinations for your PBX.
; ARG1 is the subscriber suffix, or empty for an exact-prefix call.
; Never send federated inbound calls to from-internal: that context grants the
; privileges of a trusted local phone, including feature codes and outbound routes.
[HackfedIncomingRouter]
exten => s,1,GotoIf($["${ARG1}" = ""]?attendant)
 same => n,GotoIf($[${REGEX("^[0-9]{1,6}$" ${ARG1})}]?direct:reject)

; Replace ivr-1 with the destination shown for your attendant IVR in FreePBX.
 same => n(attendant),Goto(ivr-1,s,1)

; from-did-direct exposes extensions and follow-me without granting from-internal.
 same => n(direct),Goto(from-did-direct,${ARG1},1)
 same => n(reject),Hangup(28)
