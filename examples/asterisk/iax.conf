; Bind on all interfaces
bindaddr = ::
bindport = 4569

; Considering Nebula MTU of 1300, and 32 bytes of overhead per nebula packet
trunkmtu = 1268 

; Enable only the following codecs in order of preference
disallow = all
allow = opus, ulaw, alaw 

; Hackfed – include trunk definitions generated by hackfedd
#include hackfed/iax.conf
